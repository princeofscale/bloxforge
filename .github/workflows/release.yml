name: Release

# Publishing a GitHub Release publishes both npm packages and attaches the
# freshly-built Studio plugins to that release. Requires a granular NPM_TOKEN
# with write access to both @princeofscale packages.

on:
  release:
    types: [published]

jobs:
  # The quality gate runs read-only and without checkout credentials. Only the
  # short upload job below gets `contents: write`, so a failure in the long part
  # of the release cannot happen with write scope in the environment.
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      # No `cache: npm`. This workflow is release-triggered, and the npm cache is
      # keyed by lockfile and shared with less-trusted workflows: a run that only
      # holds a default GITHUB_TOKEN can seed an entry that `npm ci` would then
      # restore and execute here.
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci
      - run: npm --prefix studio-plugin ci
      - run: npm --prefix evals ci
      - name: Quality gate (lint · typecheck · test)
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run metadata:check

  # No `contents: write` here. Three `npm ci` runs, a full build and a publish
  # execute a large amount of third-party code, and none of it needs to write to
  # the repository — the short upload job below is the only step that does.
  publish:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # enables npm provenance
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Install plugin dependencies
        working-directory: studio-plugin
        run: npm ci

      - name: Install eval dependencies
        working-directory: evals
        run: npm ci

      - name: Set version from tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Release tag must be a v-prefixed SemVer (for example, v3.0.0 or v3.0.0-rc.1)."
            exit 1
          fi
          VERSION="${RELEASE_TAG#v}"
          echo "Releasing v$VERSION"
          RELEASE_VERSION="$VERSION" node -e 'const fs=require("node:fs");const p=JSON.parse(fs.readFileSync("package.json","utf8"));p.version=process.env.RELEASE_VERSION;fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n")'

      - name: Build and publish
        run: node scripts/publish.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      # Idempotent: publish.mjs skips a version already on the registry, refuses
      # to publish blind when the registry will not say, and verifies each one
      # afterwards, so a rerun after a partial failure finishes the remaining
      # package instead of dying on the published one.
      - name: Stage plugin assets for the upload job
        uses: actions/upload-artifact@v4
        with:
          name: studio-plugins
          path: |
            studio-plugin/MCPPlugin.rbxmx
            studio-plugin/MCPInspectorPlugin.rbxmx
          if-no-files-found: error
          retention-days: 1

  # The only job with write access, and it runs no project code: it downloads the
  # artifact the publish job produced and calls `gh release upload`.
  upload-release-assets:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: studio-plugins
          path: plugins
      - name: Attach plugin assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            plugins/MCPPlugin.rbxmx \
            plugins/MCPInspectorPlugin.rbxmx \
            --clobber
