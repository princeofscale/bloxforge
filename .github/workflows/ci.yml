name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly, for the jobs that download real third-party binaries.
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      run_toolchain_matrix:
        description: 'Also run the Windows/macOS toolchain job that downloads real Rokit and Wally binaries.'
        type: boolean
        default: false

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Lint · Typecheck · Test · Build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install maintained nested-project dependencies
        run: |
          npm --prefix studio-plugin ci
          npm --prefix evals ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (with coverage ratchet)
        run: npm run test:coverage

      - name: Bridge fault-injection regression matrix
        run: npm run test:fault-injection

      - name: 10k effectively-once transport benchmark
        if: matrix.node == 20
        run: npm run test:fault-injection:10k

      - name: Build
        run: npm run build:all
        env:
          MCP_PLUGINS_DIR: ${{ runner.temp }}/bloxforge-plugins

      - name: Legacy dispatch migration baseline
        run: npm run tools:legacy-report -- --check

      - name: Generated docs are current
        run: npm run docs:check

      - name: Package metadata agrees with documented Node support
        run: npm run metadata:check

      - name: Pack dry-run (verify tarball contents)
        run: |
          npm pack --dry-run -w packages/robloxstudio-mcp
          npm pack --dry-run -w packages/robloxstudio-mcp-inspector

      - name: Doctor check (no Studio)
        run: node packages/robloxstudio-mcp/dist/index.js verify

  plugin:
    name: Studio plugin (roblox-ts compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: studio-plugin/package-lock.json

      - name: Install plugin dependencies
        working-directory: studio-plugin
        run: npm ci

      - name: Compile plugin (TypeScript → Luau)
        env:
          MCP_PLUGINS_DIR: ${{ runner.temp }}/bloxforge-plugins
        run: npm run build:plugins

      - name: Smoke-check compiled plugin output
        run: npm run test:plugin:smoke

      - name: Runtime-check compiled Luau helpers
        run: npm run test:plugin:runtime

  rojo:
    name: Rojo 7.7.0 integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install pinned stable Rojo
        run: |
          curl -fsSL https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip -o "${RUNNER_TEMP}/rojo.zip"
          echo "22503e5839864f9d7c2171c48b536fc229f2cc4d8774c9cc149f60941d864073  ${RUNNER_TEMP}/rojo.zip" | sha256sum --check -
          unzip -q "${RUNNER_TEMP}/rojo.zip" -d "${RUNNER_TEMP}/rojo"
          chmod +x "${RUNNER_TEMP}/rojo/rojo"
          echo "${RUNNER_TEMP}/rojo" >> "$GITHUB_PATH"
      - run: npm run test:rojo:integration
        env:
          BLOXFORGE_EXPECTED_ROJO_VERSION: 7.7.0

  toolchain:
    name: Rokit + Wally toolchain integration
    runs-on: ubuntu-latest
    # These steps run third-party CLIs that fetch from the network, so the job
    # gets read-only scope and no checkout credentials left in .git/config.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Pinned with a checksum: an unpinned toolchain installer is a supply-chain
      # hole, and the whole point of this job is that pinned tools resolve.
      - name: Install pinned Rokit
        run: |
          curl -fsSL https://github.com/rojo-rbx/rokit/releases/download/v1.2.0/rokit-1.2.0-linux-x86_64.zip -o "${RUNNER_TEMP}/rokit.zip"
          echo "951a7f3ec3d2a5e021fd1867d32f69f010ee4c2927f644b759578afc59c65fc0  ${RUNNER_TEMP}/rokit.zip" | sha256sum --check -
          unzip -q "${RUNNER_TEMP}/rokit.zip" -d "${RUNNER_TEMP}/rokit"
          chmod +x "${RUNNER_TEMP}/rokit/rokit"
          "${RUNNER_TEMP}/rokit/rokit" self-install
          echo "${HOME}/.rokit/bin" >> "$GITHUB_PATH"
      # Rokit resolves releases through the GitHub API, which rate-limits
      # unauthenticated runners to the point of 403ing.
      - name: Authenticate Rokit with the workflow token
        run: rokit authenticate github --token "${GITHUB_TOKEN}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install pinned tools through Rokit and verify the shims
        run: npm run test:toolchain:integration

  # Shim resolution, case folding, file locking and process termination all
  # differ on Windows and macOS, and those are exactly what the toolchain layer
  # touches. Nightly rather than per-PR: it downloads real binaries every run.
  toolchain-cross-platform:
    name: Real toolchain CLIs (${{ matrix.os }})
    # Nightly, or on demand. The `[toolchain-matrix]` commit-message trigger is
    # kept for the branch-push case, but `workflow_dispatch` means running it
    # before a release no longer needs an empty commit to carry the marker.
    if: >-
      github.event_name == 'schedule'
      || inputs.run_toolchain_matrix
      || contains(github.event.head_commit.message, '[toolchain-matrix]')
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Checksums are the per-asset digests published with the v1.2.0 release;
      # the linux-x86_64 one matches the value the Linux job already pins.
      - name: Install pinned Rokit
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            asset=rokit-1.2.0-windows-x86_64.zip
            sum=f9ba1704014ff67d51e8005f605955c7c26d2429a5312a9419dc477fc310e96d
          else
            asset=rokit-1.2.0-macos-aarch64.zip
            sum=eb8e6b4f8026db2b80ad0887c50f342958ecdbacbdeda2fd6028b3c4f774a3ee
          fi
          curl -fsSL "https://github.com/rojo-rbx/rokit/releases/download/v1.2.0/${asset}" -o "${RUNNER_TEMP}/rokit.zip"
          # Git Bash on the Windows runner ships sha256sum but not shasum (a Perl
          # script); macOS ships shasum but not sha256sum. Detect rather than
          # branch on RUNNER_OS, so this also works anywhere else it is run.
          if command -v sha256sum > /dev/null 2>&1; then
            echo "${sum}  ${RUNNER_TEMP}/rokit.zip" | sha256sum --check -
          else
            echo "${sum}  ${RUNNER_TEMP}/rokit.zip" | shasum -a 256 --check -
          fi
          unzip -q "${RUNNER_TEMP}/rokit.zip" -d "${RUNNER_TEMP}/rokit"
          chmod +x "${RUNNER_TEMP}/rokit/rokit" 2>/dev/null || true
          "${RUNNER_TEMP}/rokit/rokit" self-install
          # GITHUB_PATH is read by the runner, not by bash. On Windows $HOME is a
          # Git Bash path (/c/Users/...), which bash resolves and CreateProcess
          # does not — so the later Node steps, which run under pwsh, could not
          # find the shim even though the bash step just used it.
          rokit_bin="${HOME}/.rokit/bin"
          if command -v cygpath > /dev/null 2>&1; then
            rokit_bin="$(cygpath -w "${rokit_bin}")"
          fi
          echo "${rokit_bin}" >> "$GITHUB_PATH"
      - name: Authenticate Rokit with the workflow token
        run: rokit authenticate github --token "${GITHUB_TOKEN}"
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run test:toolchain:integration

  cross-platform:
    name: Cross-platform smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm --prefix studio-plugin ci
      - run: npm --prefix evals ci
      - run: npm run typecheck
      - run: npm test -w packages/core -- --runInBand
      - run: npm run build:all
        env:
          MCP_PLUGINS_DIR: ${{ runner.temp }}/bloxforge-plugins
      - run: npm run test:plugin:smoke
      - run: npm run test:plugin:installer
      - run: npm run verify-package

  required:
    name: Required
    if: always()
    needs: [node, plugin, rojo, toolchain, toolchain-cross-platform, cross-platform]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required job results
        env:
          NODE_RESULT: ${{ needs.node.result }}
          PLUGIN_RESULT: ${{ needs.plugin.result }}
          ROJO_RESULT: ${{ needs.rojo.result }}
          TOOLCHAIN_RESULT: ${{ needs.toolchain.result }}
          TOOLCHAIN_MATRIX_RESULT: ${{ needs.toolchain-cross-platform.result }}
          CROSS_PLATFORM_RESULT: ${{ needs.cross-platform.result }}
        run: |
          for result in "$NODE_RESULT" "$PLUGIN_RESULT" "$ROJO_RESULT" "$TOOLCHAIN_RESULT" "$TOOLCHAIN_MATRIX_RESULT" "$CROSS_PLATFORM_RESULT"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "A required CI job finished with result: $result"
              exit 1
            fi
          done
