name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Lint · Typecheck · Test · Build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install maintained nested-project dependencies
        run: |
          npm --prefix studio-plugin ci
          npm --prefix evals ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Bridge fault-injection regression matrix
        run: npm run test:fault-injection

      - name: 10k effectively-once transport benchmark
        if: matrix.node == 20
        run: npm run test:fault-injection:10k

      - name: Build
        run: npm run build:all
        env:
          MCP_PLUGINS_DIR: ${{ runner.temp }}/bloxforge-plugins

      - name: Legacy dispatch migration baseline
        run: npm run tools:legacy-report -- --check

      - name: Generated docs are current
        run: npm run docs:check

      - name: Package metadata agrees with documented Node support
        run: npm run metadata:check

      - name: Pack dry-run (verify tarball contents)
        run: |
          npm pack --dry-run -w packages/robloxstudio-mcp
          npm pack --dry-run -w packages/robloxstudio-mcp-inspector

      - name: Doctor check (no Studio)
        run: node packages/robloxstudio-mcp/dist/index.js verify

  plugin:
    name: Studio plugin (roblox-ts compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: studio-plugin/package-lock.json

      - name: Install plugin dependencies
        working-directory: studio-plugin
        run: npm ci

      - name: Compile plugin (TypeScript → Luau)
        env:
          MCP_PLUGINS_DIR: ${{ runner.temp }}/bloxforge-plugins
        run: npm run build:plugins

      - name: Smoke-check compiled plugin output
        run: npm run test:plugin:smoke

      - name: Install pinned Lune runtime
        run: |
          curl -fsSL https://github.com/lune-org/lune/releases/download/v0.10.5/lune-0.10.5-linux-x86_64.zip -o "${RUNNER_TEMP}/lune.zip"
          echo "1fb5dee6a1afa1d300092805c6e660fe06144d29dd68c45cf6956f040667f791  ${RUNNER_TEMP}/lune.zip" | sha256sum --check -
          unzip -q "${RUNNER_TEMP}/lune.zip" -d "${RUNNER_TEMP}/lune"
          chmod +x "${RUNNER_TEMP}/lune/lune"
          echo "${RUNNER_TEMP}/lune" >> "$GITHUB_PATH"

      - name: Runtime-check compiled Luau helpers
        run: npm run test:plugin:runtime

  rojo:
    name: Rojo 7.7.0 integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install pinned stable Rojo
        run: |
          curl -fsSL https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip -o "${RUNNER_TEMP}/rojo.zip"
          echo "22503e5839864f9d7c2171c48b536fc229f2cc4d8774c9cc149f60941d864073  ${RUNNER_TEMP}/rojo.zip" | sha256sum --check -
          unzip -q "${RUNNER_TEMP}/rojo.zip" -d "${RUNNER_TEMP}/rojo"
          chmod +x "${RUNNER_TEMP}/rojo/rojo"
          echo "${RUNNER_TEMP}/rojo" >> "$GITHUB_PATH"
      - run: npm run test:rojo:integration
        env:
          BLOXFORGE_EXPECTED_ROJO_VERSION: 7.7.0

  toolchain:
    name: Rokit + Wally toolchain integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Pinned with a checksum: an unpinned toolchain installer is a supply-chain
      # hole, and the whole point of this job is that pinned tools resolve.
      - name: Install pinned Rokit
        run: |
          curl -fsSL https://github.com/rojo-rbx/rokit/releases/download/v1.2.0/rokit-1.2.0-linux-x86_64.zip -o "${RUNNER_TEMP}/rokit.zip"
          echo "951a7f3ec3d2a5e021fd1867d32f69f010ee4c2927f644b759578afc59c65fc0  ${RUNNER_TEMP}/rokit.zip" | sha256sum --check -
          unzip -q "${RUNNER_TEMP}/rokit.zip" -d "${RUNNER_TEMP}/rokit"
          chmod +x "${RUNNER_TEMP}/rokit/rokit"
          "${RUNNER_TEMP}/rokit/rokit" self-install
          echo "${HOME}/.rokit/bin" >> "$GITHUB_PATH"
      - name: Install pinned tools through Rokit and verify the shims
        run: npm run test:toolchain:integration

  cross-platform:
    name: Cross-platform smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm --prefix studio-plugin ci
      - run: npm --prefix evals ci
      - run: npm run typecheck
      - run: npm test -- --runInBand
      - run: npm run build:all
        env:
          MCP_PLUGINS_DIR: ${{ runner.temp }}/bloxforge-plugins
      - run: npm run test:plugin:smoke
      - run: npm run test:plugin:installer
      - run: npm run verify-package
